name: Build patched R1 UPT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify MAX_FREEFORM fix
        run: grep -n "MAX_FREEFORM" sonix-player/src/system/decode/mp4.c

      - name: Install dependencies (including gtk-doc and gettext)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config \
            wget texinfo bison flex p7zip-full squashfs-tools genisoimage perl \
            automake libtool libtool-bin autoconf libgmp3-dev libmpfr-dev libmpc-dev \
            gtk-doc-tools gettext libffi-dev

      - name: Replace rockboxdev.sh with patched version from Rockbox upstream
        run: |
          cd sonix-player
          # Descarga el script oficial de Rockbox (que ya tiene el parche de Python 3.12)
          wget -O rockboxdev/rockboxdev.sh "https://raw.githubusercontent.com/Rockbox/rockbox/master/tools/rockboxdev.sh"
          chmod +x rockboxdev/rockboxdev.sh
          # Verifica que el script descargado tenga el parche de autoreconf para glib
          grep -n "autoreconf" rockboxdev/rockboxdev.sh | head -5

      - name: Build player
        run: |
          cd sonix-player
          make target -j1
          ls -la sonix_player sonix_launch

      - name: Install gdown
        run: pip install gdown

      - name: Get firmware base from Google Drive
        run: |
          cd sonix-packer
          gdown "1cvZdQeJsb2qYu2qv6sZaYJaP8vqW1LqG" -O r1_original.upt
          ls -la r1_original.upt
          SIZE=$(stat -c%s r1_original.upt)
          if [ "$SIZE" -lt 30000000 ]; then
            echo "ERROR: r1_original.upt is only $SIZE bytes. Download likely failed."
            exit 1
          fi

      - name: Build UPT
        run: |
          cd sonix-packer
          cp ../sonix-player/sonix_player ../sonix-player/sonix_launch .
          chmod +x sonix_player sonix_launch sonix_firmware_packer.sh
          ./sonix_firmware_packer.sh

      - name: Upload patched UPT
        uses: actions/upload-artifact@v4
        with:
          name: r1-patched
          path: sonix-packer/r1.upt
          retention-days: 30
